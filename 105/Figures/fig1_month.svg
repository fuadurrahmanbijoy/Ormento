<svg viewBox="0 0 600 230" fill="none" stroke="#1a1612" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><pattern id="h1" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#1a1612" stroke-width="1"/></pattern></defs>
<g font-family="'Libre Caslon Text','Liberation Serif',serif" fill="#1a1612" stroke="none" font-size="15">
<text x="50" y="28" font-weight="700">INCOME: Tk 5,000 comes in during the month</text>
<text x="50" y="128" font-weight="700">USE OF THE INCOME</text>
<text x="300" y="64" text-anchor="middle">Tk 5,000</text>
<text x="250" y="162" text-anchor="middle">EXPENSE: Tk 4,000 goes out</text>
<text x="550" y="200" text-anchor="end">SAVING: Tk 1,000 kept</text>
<text x="300" y="224" text-anchor="middle" font-style="italic" font-size="14">Income less expense leaves the saving: 5,000 less 4,000 is 1,000.</text>
</g>
<rect x="50" y="42" width="500" height="34"/>
<rect x="50" y="140" width="400" height="34"/>
<rect x="450" y="140" width="100" height="34" fill="url(#h1)"/>
<path d="M50 84v8M550 84v8M50 92H550"/>
</svg>
