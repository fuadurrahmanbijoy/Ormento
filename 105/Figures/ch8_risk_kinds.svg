<svg viewBox="0 0 480 225" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#1a1612" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" font-family="'Libre Caslon Text','Liberation Serif',serif" font-size="11" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect x="130" y="12" width="220" height="36" stroke-width="1.2"/><text x="240.0" y="27.0" text-anchor="middle" font-size="11" fill="#1a1612" stroke="none">Risk in a firm’s results</text><text x="240.0" y="41.0" text-anchor="middle" font-size="11" fill="#1a1612" stroke="none">(results may differ from hopes)</text><text x="120.0" y="86.0" text-anchor="middle" font-size="10" fill="#1a1612" stroke="none" font-style="italic">By where it comes from</text><text x="360.0" y="86.0" text-anchor="middle" font-size="10" fill="#1a1612" stroke="none" font-style="italic">By its cause in the firm</text><line x1="240.0" y1="48.0" x2="240.0" y2="62.0" stroke-width="1"/><line x1="120.0" y1="62.0" x2="360.0" y2="62.0" stroke-width="1"/><line x1="120.0" y1="62.0" x2="120.0" y2="74.0" stroke-width="1"/><line x1="360.0" y1="62.0" x2="360.0" y2="74.0" stroke-width="1"/><line x1="120.0" y1="92.0" x2="120.0" y2="98.0" stroke-width="1"/><line x1="63.0" y1="98.0" x2="177.0" y2="98.0" stroke-width="1"/><line x1="63.0" y1="98.0" x2="63.0" y2="108.0" stroke-width="1"/><line x1="177.0" y1="98.0" x2="177.0" y2="108.0" stroke-width="1"/><rect x="10" y="108" width="106" height="30" stroke-width="1.2"/><text x="63.0" y="127.0" text-anchor="middle" font-size="11" fill="#1a1612" stroke="none">Market risk</text><rect x="124" y="108" width="106" height="30" stroke-width="1.2"/><text x="177.0" y="127.0" text-anchor="middle" font-size="11" fill="#1a1612" stroke="none">Firm-specific risk</text><text x="63.0" y="154.0" text-anchor="middle" font-size="10" fill="#1a1612" stroke="none">affects all firms:</text><text x="63.0" y="167.0" text-anchor="middle" font-size="10" fill="#1a1612" stroke="none">interest rates rise,</text><text x="63.0" y="180.0" text-anchor="middle" font-size="10" fill="#1a1612" stroke="none">the economy slows</text><text x="177.0" y="154.0" text-anchor="middle" font-size="10" fill="#1a1612" stroke="none">affects one firm:</text><text x="177.0" y="167.0" text-anchor="middle" font-size="10" fill="#1a1612" stroke="none">a fire, or a key</text><text x="177.0" y="180.0" text-anchor="middle" font-size="10" fill="#1a1612" stroke="none">baker leaves</text><line x1="360.0" y1="92.0" x2="360.0" y2="98.0" stroke-width="1"/><line x1="303.0" y1="98.0" x2="417.0" y2="98.0" stroke-width="1"/><line x1="303.0" y1="98.0" x2="303.0" y2="108.0" stroke-width="1"/><line x1="417.0" y1="98.0" x2="417.0" y2="108.0" stroke-width="1"/><rect x="250" y="108" width="106" height="30" stroke-width="1.2"/><text x="303.0" y="127.0" text-anchor="middle" font-size="11" fill="#1a1612" stroke="none">Business risk</text><rect x="364" y="108" width="106" height="30" stroke-width="1.2"/><text x="417.0" y="127.0" text-anchor="middle" font-size="11" fill="#1a1612" stroke="none">Financial risk</text><text x="303.0" y="154.0" text-anchor="middle" font-size="10" fill="#1a1612" stroke="none">from the firm’s</text><text x="303.0" y="167.0" text-anchor="middle" font-size="10" fill="#1a1612" stroke="none">work: sales and</text><text x="303.0" y="180.0" text-anchor="middle" font-size="10" fill="#1a1612" stroke="none">costs may swing</text><text x="417.0" y="154.0" text-anchor="middle" font-size="10" fill="#1a1612" stroke="none">from borrowing:</text><text x="417.0" y="167.0" text-anchor="middle" font-size="10" fill="#1a1612" stroke="none">interest is due</text><text x="417.0" y="180.0" text-anchor="middle" font-size="10" fill="#1a1612" stroke="none">in any case</text><text x="240.0" y="203.0" text-anchor="middle" font-size="10" fill="#1a1612" stroke="none" font-style="italic">Both ways of cutting describe the same total risk.</text><text x="240.0" y="217.0" text-anchor="middle" font-size="10" fill="#1a1612" stroke="none" font-style="italic">The second pair is only previewed here; Chapter IX studies it.</text></svg>