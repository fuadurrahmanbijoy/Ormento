<svg viewBox="0 0 480 250" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#1a1612" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" font-family="Libre Caslon Text, Georgia, serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="s1" viewBox="0 0 8 7" refX="7" refY="3.5" markerWidth="8" markerHeight="7" orient="auto"><path d="M0 0L8 3.5 0 7z" fill="#1a1612" stroke="none"/></marker></defs>
<g font-size="13" fill="#1a1612" stroke="none" text-anchor="middle">
<rect x="6" y="20" width="108" height="60"/><text x="60" y="46" font-size="12">OBSTRUCTIVE</text><text x="60" y="64" font-size="11" font-style="italic">deny and resist</text>
<rect x="126" y="20" width="108" height="60"/><text x="180" y="46" font-size="12">DEFENSIVE</text><text x="180" y="64" font-size="11" font-style="italic">legal minimum</text>
<rect x="246" y="20" width="108" height="60"/><text x="300" y="46" font-size="12">ACCOMMODATIVE</text><text x="300" y="64" font-size="11" font-style="italic">agree when asked</text>
<rect x="366" y="20" width="108" height="60"/><text x="420" y="46" font-size="12">PROACTIVE</text><text x="420" y="64" font-size="11" font-style="italic">act before asked</text>
<text x="60" y="118" font-size="11">"No problem."</text><text x="180" y="118" font-size="11">"The law is met."</text><text x="300" y="118" font-size="11">"We will close at nine."</text><text x="420" y="118" font-size="11">"Let us ask first."</text>
</g>
<path d="M6 160H474" marker-end="url(#s1)"/>
<text x="474" y="186" text-anchor="end" font-size="12" font-style="italic" fill="#1a1612" stroke="none">more active</text>
