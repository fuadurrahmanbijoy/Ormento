<svg viewBox="0 0 480 310" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#1a1612" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" font-family="Libre Caslon Text, Georgia, serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="d1" viewBox="0 0 8 7" refX="7" refY="3.5" markerWidth="8" markerHeight="7" orient="auto"><path d="M0 0L8 3.5 0 7z" fill="#1a1612" stroke="none"/></marker></defs>
<g font-size="13" fill="#1a1612" stroke="none" text-anchor="middle">
<rect x="8" y="20" width="140" height="56"/><text x="78" y="44">Social power</text><text x="78" y="62" font-size="11" font-style="italic">ability to affect lives</text>
<rect x="190" y="20" width="140" height="56"/><text x="260" y="44">Social</text><text x="260" y="62">responsibility</text>
<rect x="372" y="20" width="100" height="56"/><text x="422" y="44">Five</text><text x="422" y="62">propositions</text>
<text x="169" y="36" font-size="10" font-style="italic">grows with</text>
<text x="351" y="36" font-size="10" font-style="italic">means</text>
<text x="240" y="132" letter-spacing="1.2" font-size="12">THE FIVE PROPOSITIONS</text>
</g>
<path d="M148 48h40" marker-end="url(#d1)"/><path d="M330 48h40" marker-end="url(#d1)"/>
<g font-size="12" fill="#1a1612" stroke="none">
<text x="30" y="156">1  Responsibility arises from social power</text>
<text x="30" y="176">2  Be open: listen to the public and tell the truth</text>
<text x="30" y="196">3  Count social costs and benefits before acting</text>
<text x="30" y="216">4  Build social costs into the price</text>
<text x="30" y="236">5  Help with some problems outside the firm's work</text>
</g>
<rect x="14" y="116" width="452" height="132"/>
<path d="M260 262H4V48H6" stroke-dasharray="6 4" marker-end="url(#d1)"/>
<text x="240" y="284" text-anchor="middle" font-size="11" font-style="italic" fill="#1a1612" stroke="none">Iron law: power used without responsibility is lost in time.</text>
</svg>
