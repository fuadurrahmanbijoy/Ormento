<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 292" fill="none" stroke="#1a1612" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" font-family="'Libre Caslon Text','EB Garamond','Liberation Serif',Georgia,serif" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="60" y="6" width="340" height="28"/>
<circle cx="36" cy="20" r="11"/>
<text x="36" y="24" text-anchor="middle" font-size="12" fill="#1a1612" stroke="none">1</text>
<text x="72" y="25" text-anchor="start" font-size="12" fill="#1a1612" stroke="none">Identify the problem or opportunity</text>
<path d="M230 34V46"/><path d="M226 42L230 46L234 42"/>
<rect x="60" y="46" width="340" height="28"/>
<circle cx="36" cy="60" r="11"/>
<text x="36" y="64" text-anchor="middle" font-size="12" fill="#1a1612" stroke="none">2</text>
<text x="72" y="65" text-anchor="start" font-size="12" fill="#1a1612" stroke="none">Set the criteria the choice must meet</text>
<path d="M230 74V86"/><path d="M226 82L230 86L234 82"/>
<rect x="60" y="86" width="340" height="28"/>
<circle cx="36" cy="100" r="11"/>
<text x="36" y="104" text-anchor="middle" font-size="12" fill="#1a1612" stroke="none">3</text>
<text x="72" y="105" text-anchor="start" font-size="12" fill="#1a1612" stroke="none">Gather information; develop alternatives</text>
<path d="M230 114V126"/><path d="M226 122L230 126L234 122"/>
<rect x="60" y="126" width="340" height="28"/>
<circle cx="36" cy="140" r="11"/>
<text x="36" y="144" text-anchor="middle" font-size="12" fill="#1a1612" stroke="none">4</text>
<text x="72" y="145" text-anchor="start" font-size="12" fill="#1a1612" stroke="none">Evaluate each alternative against the criteria</text>
<path d="M230 154V166"/><path d="M226 162L230 166L234 162"/>
<rect x="60" y="166" width="340" height="28"/>
<circle cx="36" cy="180" r="11"/>
<text x="36" y="184" text-anchor="middle" font-size="12" fill="#1a1612" stroke="none">5</text>
<text x="72" y="185" text-anchor="start" font-size="12" fill="#1a1612" stroke="none">Choose the best alternative</text>
<path d="M230 194V206"/><path d="M226 202L230 206L234 202"/>
<rect x="60" y="206" width="340" height="28"/>
<circle cx="36" cy="220" r="11"/>
<text x="36" y="224" text-anchor="middle" font-size="12" fill="#1a1612" stroke="none">6</text>
<text x="72" y="225" text-anchor="start" font-size="12" fill="#1a1612" stroke="none">Implement the choice</text>
<path d="M230 234V246"/><path d="M226 242L230 246L234 242"/>
<rect x="60" y="246" width="340" height="28"/>
<circle cx="36" cy="260" r="11"/>
<text x="36" y="264" text-anchor="middle" font-size="12" fill="#1a1612" stroke="none">7</text>
<text x="72" y="265" text-anchor="start" font-size="12" fill="#1a1612" stroke="none">Follow up: compare results with the goal</text>
<path d="M400 260H440V20H404"/><path d="M409 16L404 20L409 24"/>
<text transform="translate(458,150) rotate(90)" text-anchor="middle" font-size="11" font-style="italic" fill="#1a1612" stroke="none">Feedback: the results inform the next decision</text>
