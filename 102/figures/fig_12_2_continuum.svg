<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" fill="none" stroke="#1a1612" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" font-family="'Libre Caslon Text', Georgia, serif" font-size="11" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
