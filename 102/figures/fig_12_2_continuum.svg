<g fill="#1a1612" stroke="none" text-anchor="middle">
<text x="130" y="22" font-size="12">Boss-centred leading</text><text x="390" y="22" font-size="12">Team-centred leading</text>
<text x="130" y="38" font-size="9.5" font-style="italic">the leader uses authority</text><text x="390" y="38" font-size="9.5" font-style="italic">the group uses freedom</text>
