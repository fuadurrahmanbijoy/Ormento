<svg viewBox="0 0 400 230" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#1a1612" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="The control cycle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="c1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1a1612" stroke="none"/></marker></defs>
<rect x="20" y="20" width="160" height="56"/><rect x="220" y="20" width="160" height="56"/>
<rect x="220" y="154" width="160" height="56"/><rect x="20" y="154" width="160" height="56"/>
<path d="M180 48H218" marker-end="url(#c1a)"/><path d="M300 76V152" marker-end="url(#c1a)"/>
<path d="M220 182H182" marker-end="url(#c1a)"/><path d="M100 154V78" marker-end="url(#c1a)"/>
<g font-family="'Libre Caslon Text','Liberation Serif',serif" font-size="11" fill="#1a1612" stroke="none" text-anchor="middle">
<text x="100" y="44">1. Set the standard</text><text x="100" y="60" font-size="9.5" font-style="italic">from plans and objectives</text>
<text x="300" y="44">2. Measure</text><text x="300" y="60" font-size="9.5" font-style="italic">the actual result</text>
<text x="300" y="178">3. Compare</text><text x="300" y="194" font-size="9.5" font-style="italic">and find the deviation</text>
<text x="100" y="178">4. Take action</text><text x="100" y="194" font-size="9.5" font-style="italic">correct, accept or change</text>
<text x="200" y="118" font-style="italic" font-size="12">The cycle repeats</text>
<text x="200" y="133" font-size="9.5" font-style="italic">until the gap is closed</text>
</g></svg>
