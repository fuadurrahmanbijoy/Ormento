<svg viewBox="0 0 480 270" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#1a1612" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" font-family="Libre Caslon Text, Georgia, serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<g font-size="13" fill="#1a1612" stroke="none" text-anchor="middle">
<rect x="150" y="10" width="180" height="52"/><text x="240" y="32" letter-spacing="1.2">DISCRETIONARY</text><text x="240" y="50" font-size="11" font-style="italic">give freely, by choice</text>
<rect x="110" y="70" width="260" height="52"/><text x="240" y="92" letter-spacing="1.2">ETHICAL</text><text x="240" y="110" font-size="11" font-style="italic">do what is right, even if no law asks</text>
<rect x="70" y="130" width="340" height="52"/><text x="240" y="152" letter-spacing="1.2">LEGAL</text><text x="240" y="170" font-size="11" font-style="italic">obey the law</text>
<rect x="30" y="190" width="420" height="52"/><text x="240" y="212" letter-spacing="1.2">ECONOMIC</text><text x="240" y="230" font-size="11" font-style="italic">make useful goods; earn enough to survive</text>
<text x="240" y="262" font-size="11" font-style="italic">Lower layers come first.</text>
</g>
</svg>
