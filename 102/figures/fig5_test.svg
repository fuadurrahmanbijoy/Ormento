<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#1a1612" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" font-family="Libre Caslon Text, Georgia, serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="t1" viewBox="0 0 8 7" refX="7" refY="3.5" markerWidth="8" markerHeight="7" orient="auto"><path d="M0 0L8 3.5 0 7z" fill="#1a1612" stroke="none"/></marker></defs>
<g font-size="13" fill="#1a1612" stroke="none" text-anchor="middle">
<rect x="130" y="8" width="220" height="40"/><text x="240" y="33">1  Is it legal?</text>
<rect x="130" y="82" width="220" height="40"/><text x="240" y="107">2  Who is affected, and how?</text>
<rect x="130" y="156" width="220" height="40"/><text x="240" y="181">3  Is it fair?</text>
<rect x="130" y="230" width="220" height="40"/><text x="240" y="255">4  Could I tell them openly?</text>
<rect x="150" y="290" width="180" height="26"/><text x="240" y="308" font-size="12">Decide, and be ready to explain</text>
<text x="400" y="36" font-size="12" font-style="italic">No: reject</text>
</g>
<path d="M240 48V80" marker-end="url(#t1)"/><path d="M240 122V154" marker-end="url(#t1)"/><path d="M240 196V228" marker-end="url(#t1)"/><path d="M240 270V288" marker-end="url(#t1)"/>
<path d="M350 28h40" marker-end="url(#t1)"/>
<g font-size="11" font-style="italic" fill="#1a1612" stroke="none"><text x="250" y="68">yes</text><text x="250" y="142">list all, inside and outside</text><text x="250" y="216">equal and due treatment</text></g>
</svg>
