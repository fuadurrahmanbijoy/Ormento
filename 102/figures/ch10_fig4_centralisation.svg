<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 162" fill="none" stroke="#1a1612" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" font-family="'Libre Caslon Text', Georgia, serif" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9z" fill="#1a1612" stroke="none"/></marker></defs><path d="M30 70H450" marker-end="url(#m)"/><path d="M450 70H30" marker-end="url(#m)"/><path d="M90 64v12M240 64v12M390 64v12"/><text x="90" y="20" fill="#1a1612" stroke="none" text-anchor="middle" font-weight="700">Centralised</text><text x="90" y="36" fill="#1a1612" stroke="none" text-anchor="middle" font-size="11">decisions at the top</text><text x="390" y="20" fill="#1a1612" stroke="none" text-anchor="middle" font-weight="700">Decentralised</text><text x="390" y="36" fill="#1a1612" stroke="none" text-anchor="middle" font-size="11">decisions spread down</text><text x="90" y="96" fill="#1a1612" stroke="none" text-anchor="middle" font-size="11">owner decides</text><text x="90" y="110" fill="#1a1612" stroke="none" text-anchor="middle" font-size="11">everything</text><text x="240" y="96" fill="#1a1612" stroke="none" text-anchor="middle" font-size="11">bakery, Month 10:</text><text x="240" y="110" fill="#1a1612" stroke="none" text-anchor="middle" font-size="11">price central,</text><text x="240" y="124" fill="#1a1612" stroke="none" text-anchor="middle" font-size="11">buying delegated</text><text x="390" y="96" fill="#1a1612" stroke="none" text-anchor="middle" font-size="11">each branch</text><text x="390" y="110" fill="#1a1612" stroke="none" text-anchor="middle" font-size="11">sets its own prices</text><text x="240" y="152" fill="#1a1612" stroke="none" text-anchor="middle" font-style="italic" font-size="11">Illustrative positions only; the choice is made decision by decision.</text></svg>