<g fill="#1a1612" stroke="none" text-anchor="middle">
<text x="280" y="29" font-weight="bold">1. Agree objectives</text><text x="280" y="44" font-size="10">owner and each person together</text>
<text x="470" y="104" font-weight="bold">2. Plan the action</text><text x="470" y="119" font-size="10">how each will be reached</text>
<text x="415" y="219" font-weight="bold">3. Act, with support</text><text x="415" y="234" font-size="10">work and coaching</text>
<text x="145" y="219" font-weight="bold">4. Review progress</text><text x="145" y="234" font-size="10">against the agreed measures</text>
<text x="90" y="104" font-weight="bold">5. Appraise and reset</text><text x="90" y="119" font-size="10">then begin the next cycle</text>
<text x="280" y="145" font-style="italic" font-size="11">The cycle repeats</text><text x="280" y="160" font-style="italic" font-size="11">each period</text>
</g>
