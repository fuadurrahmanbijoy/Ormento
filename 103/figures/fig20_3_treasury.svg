<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
<rect width="900" height="520" fill="#f7f2e8"/>
<text x="450" y="55" text-anchor="middle" font-family="Georgia" font-size="28">Treasury shares and equity</text>
<rect x="90" y="120" width="220" height="95" rx="8" fill="#e9dfcf" stroke="#6b5a48" stroke-width="2"/>
<text x="200" y="158" text-anchor="middle" font-family="Georgia" font-size="21">Company buys</text><text x="200" y="188" text-anchor="middle" font-family="Georgia" font-size="19">own shares</text>
<line x1="310" y1="168" x2="365" y2="168" stroke="#6b5a48" stroke-width="3"/><polygon points="365,168 352,161 352,175" fill="#6b5a48"/>
<rect x="365" y="120" width="220" height="95" rx="8" fill="#eee6d8" stroke="#6b5a48" stroke-width="2"/>
<text x="475" y="158" text-anchor="middle" font-family="Georgia" font-size="21">Treasury shares</text><text x="475" y="188" text-anchor="middle" font-family="Georgia" font-size="19">reduce equity</text>
<line x1="585" y1="168" x2="640" y2="168" stroke="#6b5a48" stroke-width="3"/><polygon points="640,168 627,161 627,175" fill="#6b5a48"/>
<rect x="640" y="120" width="170" height="95" rx="8" fill="#e9dfcf" stroke="#6b5a48" stroke-width="2"/>
<text x="725" y="158" text-anchor="middle" font-family="Georgia" font-size="21">Equity</text><text x="725" y="188" text-anchor="middle" font-family="Georgia" font-size="19">changes</text>
<text x="450" y="285" text-anchor="middle" font-family="Georgia" font-size="21">Example: 2,000 shares × Tk 15 = Tk 30,000 treasury-share cost</text>
<rect x="180" y="330" width="540" height="70" rx="8" fill="#eee6d8" stroke="#6b5a48"/>
<text x="450" y="374" text-anchor="middle" font-family="Georgia" font-size="21">Treasury Shares Dr Tk 30,000 | Cash Cr Tk 30,000</text>
<text x="450" y="455" text-anchor="middle" font-family="Georgia" font-size="19">Legal permission must be checked before applying the accounting model.</text>
</svg>