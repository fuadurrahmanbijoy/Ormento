<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 525 285" fill="none" stroke="#1a1612" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" font-family="'Libre Caslon Text','Liberation Serif',Georgia,serif" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect x="20" y="15" width="280" height="44"/><text x="160" y="34" text-anchor="middle" font-size="11" fill="#1a1612" stroke="none">Does the event concern the business,</text><text x="160" y="50" text-anchor="middle" font-size="11" fill="#1a1612" stroke="none">and not the owner's private life?</text><path d="M300 37 L358 37"/><path d="M351.7 40.0 L358 37 L351.7 34.0"/><text x="329" y="31" text-anchor="middle" font-size="10" fill="#1a1612" stroke="none" font-style="italic">No</text><path d="M160 59 L160 83"/><path d="M157.0 76.7 L160 83 L163.0 76.7"/><text x="176" y="75" text-anchor="start" font-size="10" fill="#1a1612" stroke="none" font-style="italic">Yes</text><rect x="20" y="85" width="280" height="44"/><text x="160" y="104" text-anchor="middle" font-size="11" fill="#1a1612" stroke="none">Can the event be shown</text><text x="160" y="120" text-anchor="middle" font-size="11" fill="#1a1612" stroke="none">in money?</text><path d="M300 107 L358 107"/><path d="M351.7 110.0 L358 107 L351.7 104.0"/><text x="329" y="101" text-anchor="middle" font-size="10" fill="#1a1612" stroke="none" font-style="italic">No</text><path d="M160 129 L160 153"/><path d="M157.0 146.7 L160 153 L163.0 146.7"/><text x="176" y="145" text-anchor="start" font-size="10" fill="#1a1612" stroke="none" font-style="italic">Yes</text><rect x="20" y="155" width="280" height="44"/><text x="160" y="174" text-anchor="middle" font-size="11" fill="#1a1612" stroke="none">Does it change an asset, a liability</text><text x="160" y="190" text-anchor="middle" font-size="11" fill="#1a1612" stroke="none">or the owner's equity?</text><path d="M300 177 L358 177"/><path d="M351.7 180.0 L358 177 L351.7 174.0"/><text x="329" y="171" text-anchor="middle" font-size="10" fill="#1a1612" stroke="none" font-style="italic">No</text><path d="M160 199 L160 223"/><path d="M157.0 216.7 L160 223 L163.0 216.7"/><text x="176" y="215" text-anchor="start" font-size="10" fill="#1a1612" stroke="none" font-style="italic">Yes</text><rect x="20" y="225" width="280" height="44"/><text x="160" y="244" text-anchor="middle" font-size="11" fill="#1a1612" stroke="none" font-weight="700">It is a transaction:</text><text x="160" y="260" text-anchor="middle" font-size="11" fill="#1a1612" stroke="none">analyse it and record it.</text><rect x="360" y="15" width="150" height="184"/><text x="435" y="60" text-anchor="middle" font-size="11" fill="#1a1612" stroke="none" font-weight="700">Not a transaction,</text><text x="435" y="76" text-anchor="middle" font-size="11" fill="#1a1612" stroke="none" font-weight="700">so not recorded.</text><text x="435" y="110" text-anchor="middle" font-size="10" fill="#1a1612" stroke="none" font-style="italic">Examples: a promise,</text><text x="435" y="126" text-anchor="middle" font-size="10" fill="#1a1612" stroke="none" font-style="italic">a price list, a private bill,</text><text x="435" y="142" text-anchor="middle" font-size="10" fill="#1a1612" stroke="none" font-style="italic">a hope of a future order</text></svg>