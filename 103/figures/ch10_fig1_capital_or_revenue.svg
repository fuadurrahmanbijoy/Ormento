<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 266" fill="none" stroke="#1a1612" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#1a1612" stroke-width="1.2"/></marker></defs><rect x="150" y="8" width="180" height="32" rx="2" /><text x="240" y="28" text-anchor="middle" font-size="11" stroke="none" fill="#1a1612" font-family="'Libre Caslon Text','Liberation Serif',Georgia,serif">Money is spent on an asset</text><line x1="240" y1="40" x2="240" y2="62" marker-end="url(#ah1)"/><rect x="100" y="62" width="280" height="48" rx="2" /><text x="240" y="82" text-anchor="middle" font-size="11" stroke="none" fill="#1a1612" font-family="'Libre Caslon Text','Liberation Serif',Georgia,serif">Will the spending serve the business</text><text x="240" y="98" text-anchor="middle" font-size="11" stroke="none" fill="#1a1612" font-family="'Libre Caslon Text','Liberation Serif',Georgia,serif">for more than one period?</text><line x1="240" y1="110" x2="240" y2="140" marker-end="url(#ah1)"/><text x="250" y="130" text-anchor="start" font-size="10" font-style="italic" stroke="none" fill="#1a1612" font-family="'Libre Caslon Text','Liberation Serif',Georgia,serif">Yes</text><rect x="100" y="140" width="280" height="48" rx="2" /><text x="240" y="160" text-anchor="middle" font-size="11" stroke="none" fill="#1a1612" font-family="'Libre Caslon Text','Liberation Serif',Georgia,serif">Does it buy the asset, add to it,</text><text x="240" y="176" text-anchor="middle" font-size="11" stroke="none" fill="#1a1612" font-family="'Libre Caslon Text','Liberation Serif',Georgia,serif">or lengthen its useful life?</text><polyline points="380,86 455,86 455,212" marker-end="url(#ah1)"/><text x="400" y="80" text-anchor="start" font-size="10" font-style="italic" stroke="none" fill="#1a1612" font-family="'Libre Caslon Text','Liberation Serif',Georgia,serif">No</text><line x1="170" y1="188" x2="170" y2="212" marker-end="url(#ah1)"/><text x="176" y="204" text-anchor="start" font-size="10" font-style="italic" stroke="none" fill="#1a1612" font-family="'Libre Caslon Text','Liberation Serif',Georgia,serif">Yes</text><line x1="310" y1="188" x2="310" y2="212" marker-end="url(#ah1)"/><text x="316" y="204" text-anchor="start" font-size="10" font-style="italic" stroke="none" fill="#1a1612" font-family="'Libre Caslon Text','Liberation Serif',Georgia,serif">No</text><rect x="70" y="214" width="200" height="44" rx="2" /><text x="170" y="233" text-anchor="middle" font-size="11" font-weight="700" stroke="none" fill="#1a1612" font-family="'Libre Caslon Text','Liberation Serif',Georgia,serif">Capital expenditure:</text><text x="170" y="249" text-anchor="middle" font-size="11" stroke="none" fill="#1a1612" font-family="'Libre Caslon Text','Liberation Serif',Georgia,serif">add to the asset's cost</text><rect x="300" y="214" width="170" height="44" rx="2" /><text x="385" y="233" text-anchor="middle" font-size="11" font-weight="700" stroke="none" fill="#1a1612" font-family="'Libre Caslon Text','Liberation Serif',Georgia,serif">Revenue expenditure:</text><text x="385" y="249" text-anchor="middle" font-size="11" stroke="none" fill="#1a1612" font-family="'Libre Caslon Text','Liberation Serif',Georgia,serif">charge as an expense now</text></svg>
