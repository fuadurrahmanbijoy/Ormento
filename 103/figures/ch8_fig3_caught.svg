<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" fill="none" stroke="#1a1612" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" font-family="'Libre Caslon Text', serif" font-size="10.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="4" y="4" width="284" height="242"/><rect x="312" y="4" width="284" height="242"/>
<rect x="8" y="8" width="276" height="234" stroke-width=".5"/><rect x="316" y="8" width="276" height="234" stroke-width=".5"/>
<path d="M20 44h260M328 44h260" stroke-width=".7"/>
<g fill="#1a1612" stroke="none">
<text x="146" y="32" text-anchor="middle" font-weight="bold" letter-spacing="1">THE TEST SHOWS A DIFFERENCE</text>
<text x="454" y="32" text-anchor="middle" font-weight="bold" letter-spacing="1">THE TEST SHOWS NOTHING</text>
<text x="24" y="70">A posting made to one side only</text>
<text x="24" y="100">Two digits swapped in one amount</text>
<text x="24" y="130">A column or balance added wrongly</text>
<text x="24" y="160">A balance copied wrongly to the list</text>
<text x="24" y="190">A balance placed in the wrong column</text>
<text x="24" y="220">An account left off the list</text>
<text x="332" y="64">1  Omission: both sides left out</text>
<text x="332" y="92">2  Commission: wrong account, same type</text>
<text x="332" y="120">3  Principle: wrong type of account</text>
<text x="332" y="148">4  Original entry: wrong amount, both sides</text>
<text x="332" y="176">5  Compensating: two errors cancel</text>
<text x="332" y="204">6  Reversal: debit and credit exchanged</text>
<text x="332" y="232" font-style="italic" font-size="9.5">Each keeps total debits equal to total credits.</text>
