<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 326" width="100%" font-family="Libre Caslon Text, Georgia, serif" fill="#000" stroke="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect x="200" y="6" width="220" height="26" rx="6" fill="#fff" stroke="#000" stroke-width="1"/><text x="310" y="23" font-size="11" text-anchor="middle">A business makes a payment</text><line x1="310" y1="32" x2="310.0" y2="53.0" stroke="#000" stroke-width="1"/><polygon points="310,58 307.8,53.0 312.2,53.0" fill="#000" stroke="#000" stroke-width="0.5"/><rect x="190" y="58" width="240" height="48" rx="6" fill="#fff" stroke="#000" stroke-width="1"/><text x="310" y="78" font-size="10.5" text-anchor="middle">1. Will it give a benefit for</text><text x="310" y="91" font-size="10.5" text-anchor="middle">more than one period?</text><rect x="190" y="150" width="240" height="48" rx="6" fill="#fff" stroke="#000" stroke-width="1"/><text x="310" y="170" font-size="10.5" text-anchor="middle">2. Does it buy an asset, or add to</text><text x="310" y="183" font-size="10.5" text-anchor="middle">an asset, or improve one?</text><line x1="310" y1="106" x2="310.0" y2="141.0" stroke="#000" stroke-width="1"/><polygon points="310,146 307.8,141.0 312.2,141.0" fill="#000" stroke="#000" stroke-width="0.5"/><text x="322" y="130" font-size="10" text-anchor="start" font-style="italic">Yes</text><rect x="8" y="64" width="160" height="150" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="88" y="82" font-size="11" text-anchor="middle" font-weight="bold">Revenue expenditure</text><text x="88" y="98" font-size="10" text-anchor="middle">Debit an expense account.</text><text x="88" y="126" font-size="10" text-anchor="middle">Examples:</text><text x="88" y="140" font-size="10" text-anchor="middle">servicing the mixer</text><text x="88" y="154" font-size="10" text-anchor="middle">a worn door handle</text><text x="88" y="168" font-size="10" text-anchor="middle">the electricity bill</text><line x1="190" y1="82" x2="177.0" y2="82.0" stroke="#000" stroke-width="1"/><polygon points="172,82 177.0,79.8 177.0,84.2" fill="#000" stroke="#000" stroke-width="0.5"/><text x="181" y="74" font-size="10" text-anchor="middle" font-style="italic">No</text><line x1="190" y1="174" x2="177.0" y2="174.0" stroke="#000" stroke-width="1"/><polygon points="172,174 177.0,171.8 177.0,176.2" fill="#000" stroke="#000" stroke-width="0.5"/><text x="181" y="166" font-size="10" text-anchor="middle" font-style="italic">No</text><line x1="310" y1="198" x2="310.0" y2="229.0" stroke="#000" stroke-width="1"/><polygon points="310,234 307.8,229.0 312.2,229.0" fill="#000" stroke="#000" stroke-width="0.5"/><text x="322" y="220" font-size="10" text-anchor="start" font-style="italic">Yes</text><rect x="160" y="234" width="300" height="84" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="310" y="252" font-size="11" text-anchor="middle" font-weight="bold">Capital expenditure</text><text x="310" y="268" font-size="10" text-anchor="middle">Debit the asset account (Equipment).</text><text x="310" y="286" font-size="10" text-anchor="middle">Examples: a new oven; delivery and installation;</text><text x="310" y="300" font-size="10" text-anchor="middle">a larger motor that adds capacity</text></svg>